version: '3.8'

# Configuración optimizada para servidores con recursos limitados (1-2 GiB RAM)
# Para pruebas y producción pequeña

services:
  postgres:
    image: postgres:15-alpine
    container_name: exhibidores_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-exhibidores}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-exhibidores123}
      POSTGRES_DB: ${POSTGRES_DB:-exhibidores_db}
      # Optimizaciones para bajo consumo de memoria
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    command: postgres -c shared_buffers=64MB -c effective_cache_size=128MB -c maintenance_work_mem=32MB -c work_mem=2MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-exhibidores}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exhibidores_network
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 200M

  redis:
    image: redis:7-alpine
    container_name: exhibidores_redis
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - exhibidores_network
    deploy:
      resources:
        limits:
          memory: 150M
        reservations:
          memory: 100M

  minio:
    image: minio/minio:latest
    container_name: exhibidores_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - exhibidores_network
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 150M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exhibidores_backend
    # Sin --reload en producción, con 1 worker para ahorrar memoria
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1 --limit-concurrency 50
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      # Optimización de Python
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/app
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - exhibidores_network
    deploy:
      resources:
        limits:
          memory: 300M
        reservations:
          memory: 200M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exhibidores_worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=2 --max-tasks-per-child=50
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - TWILIO_WHATSAPP_NUMBER=${TWILIO_WHATSAPP_NUMBER}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
    volumes:
      - ./backend:/app
    depends_on:
      - redis
      - postgres
    networks:
      - exhibidores_network
    deploy:
      resources:
        limits:
          memory: 200M
        reservations:
          memory: 150M

  frontend:
    image: exhibidores-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${BACKEND_URL:-http://localhost:8001}
    container_name: exhibidores_frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - exhibidores_network
    deploy:
      resources:
        limits:
          memory: 50M
        reservations:
          memory: 30M

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  exhibidores_network:
    driver: bridge












